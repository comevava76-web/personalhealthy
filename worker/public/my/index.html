<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>HINT 365 · Web Dashboard</title>
<link rel="stylesheet" href="/my/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/my/">
    <svg viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="24" fill="#16284A"/>
      <path d="M13,57.2 H33.5 L38.9,49.7 L44.3,57.2 H48.6 L55.1,27 L62.1,84.2 L68,57.2 H74.5 L79.9,51.8 L85.3,57.2 H95"
        fill="none" stroke="#8C7BF2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span><b>HINT 365</b><small>Web Dashboard</small></span>
  </a>
  <nav id="modules" class="modules"></nav>
  <div class="actions" id="actions" hidden>
    <button class="btn primary" id="btn-share" type="button"></button>
    <button class="btn" id="btn-pdf" type="button"></button>
  </div>
</header>

<!-- the A4 pages of the PDF, built only when "PDF" is pressed and shown only when printing -->
<div id="print"></div>

<main id="main">
  <div class="loading" id="loading"><span class="pulse"></span></div>
</main>

<footer class="foot">
  <p id="foot-note"></p>
  <p>HINT 365 · HealthyInstantTracker · © <span id="years">2026</span> · <span id="rights"></span> ·
    <a href="/terms" id="terms-link"></a> · <a href="/privacy">Privacy</a> · <a href="#" id="cookie-link">Cookie</a></p>
</footer>

<dialog id="share" aria-labelledby="sh-title">
  <form method="dialog" class="dlg">
    <h3 id="sh-title"></h3>
    <p class="muted" id="sh-intro"></p>
    <div class="send two-way">
      <button class="btn primary" id="sh-mail" type="button"></button>
      <button class="btn wa" id="sh-wa" type="button"></button>
    </div>
    <p class="small" id="sh-status" role="status"></p>
    <p class="muted small" id="sh-exp"></p>
    <div class="dlg-foot">
      <button class="btn ghost small" id="sh-revoke" type="button"></button>
      <span class="grow"></span>
      <button class="btn" value="close" id="sh-close"></button>
    </div>
  </form>
</dialog>

<script src="/my/lab-labels.js"></script>
<script src="/my/report.js"></script>
<script src="/my/app.js"></script>
</body>
</html>
