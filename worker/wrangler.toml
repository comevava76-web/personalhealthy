name = "personalhealthy-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Static files, served before the code: the latest app (public/HINT.apk, put there by the build and never
# committed), the guides and the My Dash page (public/my). Every other address goes to the code.
[assets]
directory = "./public"
binding = "ASSETS"

# Every day at 03:17 UTC: readings older than 365 days are deleted (see purgeOld in src/index.ts)
[triggers]
crons = ["17 3 * * *"]

# D1 database "personalhealthy", with data bound to the European Union.
# GitHub creates it on the first build and puts its id here in place of D1_DATABASE_ID.
[[d1_databases]]
binding = "DB"
database_name = "personalhealthy"
database_id = "D1_DATABASE_ID"

# D1 database "personalhealthy-backup" (EU): only a copy of the acceptances of the terms of use, as legal proof.
# GitHub creates it on the first build and puts its id here in place of BACKUP_DATABASE_ID.
[[d1_databases]]
binding = "BACKUP"
database_name = "personalhealthy-backup"
database_id = "BACKUP_DATABASE_ID"

[vars]
MODEL = "claude-sonnet-5"
# Claude Sonnet 5 prices in dollars per million tokens (update them if they change)
PRICE_IN_PER_MTOK = "2"
PRICE_OUT_PER_MTOK = "10"
