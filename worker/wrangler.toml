name = "personalhealthy-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# D1 database "personalhealthy", with data bound to the European Union.
# GitHub creates it on the first build and puts its id here in place of D1_DATABASE_ID.
[[d1_databases]]
binding = "DB"
database_name = "personalhealthy"
database_id = "D1_DATABASE_ID"

[vars]
MODEL = "claude-sonnet-5"
# Claude Sonnet 5 prices in dollars per million tokens (update them if they change)
PRICE_IN_PER_MTOK = "2"
PRICE_OUT_PER_MTOK = "10"
