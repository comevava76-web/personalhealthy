<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1630"/><stop offset="1" stop-color="#14305A"/></linearGradient>
 <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8C7BF2"/><stop offset="1" stop-color="#1FC7B5"/></linearGradient>
 <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C7BF2"/><stop offset="1" stop-color="#1FC7B5"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/></linearGradient>
 <linearGradient id="diary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FC7B5" stop-opacity=".30"/><stop offset="1" stop-color="#8C7BF2" stop-opacity=".18"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1FC7B5" stop-opacity=".35"/><stop offset="1" stop-color="#1FC7B5" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".05"/></pattern>
 <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1FC7B5"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#dots)"/>
<circle cx="615" cy="330" r="230" fill="url(#glow)"/>
<text x="30" y="58" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="2">HINT 365</text>
<rect x="30" y="70" width="128" height="4" rx="2" fill="url(#acc)"/>
<text x="212" y="57" font-size="19" fill="#C9D4EA">Your blood-pressure and lab-results diary · how it works</text>
<rect x="890" y="38" width="92" height="26" rx="13" fill="none" stroke="#1FC7B5" stroke-opacity=".7"/>
<rect x="990" y="38" width="112" height="26" rx="13" fill="none" stroke="#1FC7B5" stroke-opacity=".7"/>
<rect x="1110" y="38" width="62" height="26" rx="13" fill="none" stroke="#1FC7B5" stroke-opacity=".7"/>
<text x="936" y="56" text-anchor="middle" font-size="12" fill="#BDF3EC">Private</text>
<text x="1046" y="56" text-anchor="middle" font-size="12" fill="#BDF3EC">Data in the EU</text>
<text x="1141" y="56" text-anchor="middle" font-size="12" fill="#BDF3EC">No ads</text>
<text x="135.0" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2.4" fill="#1FC7B5">GET STARTED</text>
<text x="379.0" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2.4" fill="#1FC7B5">PUT DATA IN</text>
<text x="625.0" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2.4" fill="#1FC7B5">YOUR DIARY</text>
<text x="864.0" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2.4" fill="#1FC7B5">GET VALUE OUT</text>
<text x="1085.0" y="128" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2.4" fill="#1FC7B5">YOUR DOCTOR</text>
<rect x="30" y="148" width="210" height="120" rx="16" fill="url(#card)" stroke="#8C7BF2" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="64" cy="184" r="19" fill="url(#acc)"/><g transform="translate(64,184)"><rect x="-7" y="-11" width="14" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="0" cy="7" r="1.4" fill="#fff"/></g>
<circle cx="222" cy="166" r="10" fill="#FFFFFF" fill-opacity=".12"/><text x="222" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
<text x="92" y="189" font-size="16.5" font-weight="700" fill="#FFFFFF">Install</text>
<text x="48" y="220" font-size="12.6" fill="#C9D4EA">the app on Android</text>
<text x="48" y="237" font-size="12.6" fill="#C9D4EA">(iPhone coming next)</text>
<rect x="30" y="288" width="210" height="120" rx="16" fill="url(#card)" stroke="#8C7BF2" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="64" cy="324" r="19" fill="url(#acc)"/><g transform="translate(64,324)"><circle cx="0" cy="-4" r="4.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M-8,9 C-8,2 8,2 8,9" fill="none" stroke="#fff" stroke-width="2"/></g>
<circle cx="222" cy="306" r="10" fill="#FFFFFF" fill-opacity=".12"/><text x="222" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
<text x="92" y="329" font-size="16.5" font-weight="700" fill="#FFFFFF">Sign in</text>
<text x="48" y="360" font-size="12.6" fill="#C9D4EA">with your Google account:</text>
<text x="48" y="377" font-size="12.6" fill="#C9D4EA">same data on a new phone</text>
<rect x="30" y="428" width="210" height="120" rx="16" fill="url(#card)" stroke="#8C7BF2" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="64" cy="464" r="19" fill="url(#acc)"/><g transform="translate(64,464)"><path d="M-7,-11 H4 L8,-7 V11 H-7 Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M-3,2 L0,5 L5,-1" fill="none" stroke="#fff" stroke-width="2"/></g>
<circle cx="222" cy="446" r="10" fill="#FFFFFF" fill-opacity=".12"/><text x="222" y="450" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
<text x="92" y="469" font-size="16.5" font-weight="700" fill="#FFFFFF">Accept the terms</text>
<text x="48" y="500" font-size="12.6" fill="#C9D4EA">read to the end,</text>
<text x="48" y="517" font-size="12.6" fill="#C9D4EA">save them as a PDF</text>
<path d="M135 268 L135 286" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<path d="M135 408 L135 426" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<rect x="268" y="168" width="222" height="160" rx="16" fill="url(#card)" stroke="#8C7BF2" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="302" cy="204" r="19" fill="url(#acc)"/><g transform="translate(302,204)"><rect x="-4" y="-11" width="8" height="13" rx="4" fill="none" stroke="#fff" stroke-width="2"/><path d="M-8,-1 C-8,8 8,8 8,-1 M0,7 V11" fill="none" stroke="#fff" stroke-width="2"/></g>
<text x="330" y="209" font-size="16.5" font-weight="700" fill="#FFFFFF">Record a reading</text>
<text x="286" y="240" font-size="12.6" fill="#C9D4EA">Say it aloud, or snap the</text>
<text x="286" y="257" font-size="12.6" fill="#C9D4EA">monitor's display (AI Scan).</text>
<text x="286" y="274" font-size="12.6" fill="#C9D4EA">Check the three numbers,</text>
<text x="286" y="291" font-size="12.6" fill="#C9D4EA">then confirm.</text>
<rect x="268" y="368" width="222" height="160" rx="16" fill="url(#card)" stroke="#8C7BF2" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="302" cy="404" r="19" fill="url(#acc)"/><g transform="translate(302,404)"><path d="M-7,-11 H4 L8,-7 V11 H-7 Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M-3,-3 H4 M-3,1 H4 M-3,5 H2" stroke="#fff" stroke-width="2"/></g>
<text x="330" y="409" font-size="16.5" font-weight="700" fill="#FFFFFF">Import a lab report</text>
<text x="286" y="440" font-size="12.6" fill="#C9D4EA">Pick a PDF or a photo.</text>
<text x="286" y="457" font-size="12.6" fill="#C9D4EA">Read on your phone: only</text>
<text x="286" y="474" font-size="12.6" fill="#C9D4EA">the date and the values</text>
<text x="286" y="491" font-size="12.6" fill="#C9D4EA">are kept, never your name.</text>
<path d="M240 488 L254 488 L254 248 L266 248" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<path d="M240 498 L258 498 L258 448 L266 448" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<rect x="520" y="148" width="210" height="300" rx="20" fill="url(#diary)" stroke="#1FC7B5" stroke-width="2"/>
<circle cx="625" cy="196" r="28" fill="url(#acc)"/><g transform="translate(625,196) scale(1.4)"><path d="M0,-12 L10,-8 V0 C10,7 5,11 0,13 C-5,11 -10,7 -10,0 V-8 Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M-4,0 L-1,3 L5,-3" fill="none" stroke="#fff" stroke-width="2"/></g>
<text x="625" y="252" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">Your data</text>
<text x="625" y="272" text-anchor="middle" font-size="13" fill="#BDF3EC">kept safe in the EU</text>
<circle cx="546" cy="296" r="3.5" fill="#1FC7B5"/><text x="558" y="300" font-size="13" font-weight="700" fill="#FFFFFF">Readings</text><text x="558" y="315" font-size="11.6" fill="#C9D4EA">kept 365 days</text>
<circle cx="546" cy="332" r="3.5" fill="#1FC7B5"/><text x="558" y="336" font-size="13" font-weight="700" fill="#FFFFFF">Lab results</text><text x="558" y="351" font-size="11.6" fill="#C9D4EA">until you delete them</text>
<circle cx="546" cy="368" r="3.5" fill="#1FC7B5"/><text x="558" y="372" font-size="13" font-weight="700" fill="#FFFFFF">Only yours</text><text x="558" y="387" font-size="11.6" fill="#C9D4EA">nobody else sees them</text>
<circle cx="546" cy="404" r="3.5" fill="#1FC7B5"/><text x="558" y="408" font-size="13" font-weight="700" fill="#FFFFFF">Backed up</text><text x="558" y="423" font-size="11.6" fill="#C9D4EA">every night, encrypted</text>
<path d="M490 248 L518 248" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<path d="M490 448 L505 448 L505 420 L518 420" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<rect x="520" y="470" width="210" height="58" rx="14" fill="url(#card)" stroke="#9AAACA" stroke-opacity=".5"/>
<g transform="translate(548,499)"><path d="M-7,-6 H7 M-3,-6 V-9 H3 V-6 M-5,-6 L-4,10 H4 L5,-6" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></g>
<text x="568" y="494" font-size="14" font-weight="700" fill="#FFFFFF">Delete anytime</text>
<text x="568" y="511" font-size="11.6" fill="#C9D4EA">a reading, a date, or all</text>
<path d="M625,470 V452" stroke="#9AAACA" stroke-width="2" marker-end="url(#ah)"/>
<rect x="758" y="148" width="212" height="110" rx="16" fill="url(#card)" stroke="#1FC7B5" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="792" cy="184" r="19" fill="url(#acc)"/><g transform="translate(792,184)"><path d="M-9,10 H9" stroke="#fff" stroke-width="2"/><rect x="-7" y="0" width="4" height="8" fill="#fff"/><rect x="-1" y="-6" width="4" height="14" fill="#fff"/><rect x="5" y="-2" width="4" height="10" fill="#fff"/></g>
<text x="820" y="189" font-size="16.5" font-weight="700" fill="#FFFFFF">See</text>
<text x="776" y="220" font-size="12.6" fill="#C9D4EA">your week at a glance,</text>
<text x="776" y="237" font-size="12.6" fill="#C9D4EA">charts and lab table</text>
<rect x="758" y="278" width="212" height="110" rx="16" fill="url(#card)" stroke="#1FC7B5" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="792" cy="314" r="19" fill="url(#acc)"/><g transform="translate(792,314)"><path d="M0,-10 V5 M-6,-1 L0,5 L6,-1 M-9,10 H9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
<text x="820" y="319" font-size="16.5" font-weight="700" fill="#FFFFFF">Download</text>
<text x="776" y="350" font-size="12.6" fill="#C9D4EA">the report as a PDF,</text>
<text x="776" y="367" font-size="12.6" fill="#C9D4EA">saved on your phone</text>
<rect x="758" y="408" width="212" height="120" rx="16" fill="url(#card)" stroke="#1FC7B5" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="792" cy="444" r="19" fill="url(#acc)"/><g transform="translate(792,444)"><circle cx="-6" cy="0" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="6" cy="-7" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="6" cy="7" r="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M-3,-1.5 L3,-5.5 M-3,1.5 L3,5.5" stroke="#fff" stroke-width="2"/></g>
<text x="820" y="449" font-size="16.5" font-weight="700" fill="#FFFFFF">Share</text>
<text x="776" y="480" font-size="12.6" fill="#C9D4EA">send the PDF and a</text>
<text x="776" y="497" font-size="12.6" fill="#C9D4EA">private link (7 days)</text>
<text x="776" y="514" font-size="12.6" fill="#C9D4EA">by email or WhatsApp</text>
<path d="M730 300 L744 300 L744 203 L756 203" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<path d="M730 300 L744 300 L744 333 L756 333" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<path d="M730 400 L744 400 L744 463 L756 463" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<rect x="1000" y="408" width="170" height="120" rx="16" fill="url(#card)" stroke="#8C7BF2" stroke-opacity=".55" stroke-width="1.3"/>
<circle cx="1034" cy="444" r="19" fill="url(#acc)"/><g transform="translate(1034,444)"><circle cx="0" cy="0" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M0,-5 V5 M-5,0 H5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="1062" y="449" font-size="16.5" font-weight="700" fill="#FFFFFF">Doctor</text>
<text x="1018" y="480" font-size="12.6" fill="#C9D4EA">opens the link,</text>
<text x="1018" y="497" font-size="12.6" fill="#C9D4EA">reads only,</text>
<text x="1018" y="514" font-size="12.6" fill="#C9D4EA">you can withdraw it</text>
<path d="M970 468 L998 468" fill="none" stroke="#1FC7B5" stroke-width="2" stroke-opacity=".85" marker-end="url(#ah)"/>
<rect x="30" y="566" width="1140" height="74" rx="18" fill="#FFFFFF" fill-opacity=".06" stroke="url(#acc)" stroke-width="1.5"/>
<text x="600" y="597" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">Record in seconds · See your week · Share with your doctor</text>
<text x="600" y="623" text-anchor="middle" font-size="13" fill="#C9D4EA">HINT 365 keeps track of what you record. It gives no diagnosis and no advice: your doctor decides.</text>
<text x="1170" y="660" text-anchor="end" font-size="11" fill="#7F90B4">HINT 365 · HealthyInstantTracker</text>
</svg>