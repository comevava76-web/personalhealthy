name: Owner phone (move the owner's powers to a new phone)

# Run by hand: Actions → Owner phone → Run workflow, after signing in with Google on the new phone.
# The owner's powers (Admin console, app versions, settings) work only from the phone on record. A stolen Google
# account can move the owner's account to another phone, but not these powers: only this workflow can, and it needs
# the owner's GitHub login. It records, as the owner's phone, the phone the owner's account is on right now.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MOVE to give the owner powers to the phone the owner account is on now'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Record the owner's current phone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c6de5312c59db866e1a8e07d3c21c63
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "MOVE" ] || { echo "Not confirmed: type MOVE"; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API?name=personalhealthy" | jq -r '.result[]? | select(.name=="personalhealthy") | .uuid' | head -1)
          [ -n "$ID" ] || { echo "Database not found"; exit 1; }
          SQL="INSERT INTO settings (key, value) SELECT 'owner_key', public_key FROM persons WHERE is_admin = 1 AND public_key IS NOT NULL ORDER BY created_at LIMIT 1 ON CONFLICT (key) DO UPDATE SET value = excluded.value"
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/$ID/query" --data "$(jq -n --arg s "$SQL" '{sql: $s}')" \
            | jq -e '.success' >/dev/null || { echo "Could not save"; exit 1; }
          # every open web session of the owner must be opened again from the new phone
          SQL2="UPDATE web_sessions SET owner = 0 WHERE person_id IN (SELECT id FROM persons WHERE is_admin = 1)"
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/$ID/query" --data "$(jq -n --arg s "$SQL2" '{sql: $s}')" >/dev/null || true
          echo "The owner's powers now belong to the phone the owner account is on. Open the app on it."
