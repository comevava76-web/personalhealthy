name: Docs check

# The documents in docs/ must follow every change. This fails when:
#  - docs/legal/ (terms, privacy, home) differs from the pages the site serves (worker/src/pages.ts);
#  - an HTML source of a PDF changed and its PDF did not (architecture document, user guides).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Terms, privacy and home in docs/legal match the site
        working-directory: worker
        run: |
          npm install --no-audit --no-fund --silent
          node scripts/export-docs.mjs
          git diff --exit-code -- ../docs/legal \
            || { echo "docs/legal is out of date: run 'cd worker && node scripts/export-docs.mjs' and commit"; exit 1; }
      - name: Every changed HTML source comes with its PDF
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "Nothing to compare"; exit 0; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          fail=0
          pair() { if echo "$CHANGED" | grep -qx "$1" && ! echo "$CHANGED" | grep -qx "$2"; then echo "$1 changed but $2 did not"; fail=1; fi; }
          pair docs/architecture/architecture.html docs/architecture/HINT-Architecture.pdf
          pair docs/guide-it.html docs/HINT-Guida-IT.pdf
          pair docs/guide-en.html docs/HINT-Guide-EN.pdf
          pair docs/compliance/dossier.html docs/compliance/HINT365-Compliance.pdf
          pair docs/overview/overview.html docs/HINT365-How-it-works.pdf
          exit $fail
      - name: The compliance dossier matches the controls and the terms (Admin → Observability links into it)
        run: |
          node --experimental-strip-types worker/scripts/compliance-dossier.mjs check
          cmp docs/compliance/HINT365-Compliance.pdf worker/public/my/HINT365-Compliance.pdf
      - name: The terms shown in the app are the server's text (same version, same fingerprint)
        run: node --experimental-strip-types worker/scripts/sync-notice.mjs "$PWD/worker/src/notices.ts" android/app/src/main/res check
      - name: Every app text exists in Italian, German and French
        # Long legal texts may stay in English (Android falls back to it): list them in ALLOWED.
        run: |
          ALLOWED="disc_body"
          R=android/app/src/main/res
          keys() { grep -o '<string name="[^"]*"' "$1" | grep -v translatable | sed 's/.*name="//;s/"//' | sort -u; }
          grep '<string ' $R/values/strings.xml | grep -v 'translatable="false"' | grep -o 'name="[^"]*"' | sed 's/name="//;s/"//' | sort -u > /tmp/base
          fail=0
          for l in it de fr; do
            missing=$(keys $R/values-$l/strings.xml | comm -23 /tmp/base - | grep -vxF "$(echo $ALLOWED | tr ' ' '\n')" || true)
            if [ -n "$missing" ]; then echo "values-$l is missing: $missing"; fail=1; fi
          done
          exit $fail
      - name: No text overflows a box or a page (architecture document, guides)
        run: |
          npm install --no-save --no-audit --no-fund --silent playwright@1
          npx playwright install --with-deps chromium >/dev/null
          node docs/check-layout.cjs docs/architecture/architecture.html docs/guide-it.html docs/guide-en.html
