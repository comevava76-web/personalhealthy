name: Android build check

# Every pull request that touches the app (including Dependabot's library updates) must compile before it is
# merged: the APK is built here without the signing secrets (the release build on main uses them) and thrown away.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-check.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile the app
        working-directory: android
        env:
          BATTITO_API_URL: https://example.invalid
          GOOGLE_WEB_CLIENT_ID: check.apps.googleusercontent.com
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
