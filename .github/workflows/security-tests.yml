name: Security tests

# Part of the continuous loop (docs/architecture, page 5). Test data only, never real readings.
#  - On every pull request that touches the server, the web or the tests: the functional and security suite
#    (signatures, replay, IDOR, limits, privacy, doctor links, admin rights, purge) and the time-zone checks
#    against a local copy of the Worker. A failed check blocks the merge.
#  - Every night: the same, plus a passive probe of the live site (headers, forged credentials, guessed links,
#    error pages, CORS; read-only, it never signs in), the audit of the server's tools, the vulnerability scan
#    of every library against OSV.dev (full Android tree), Semgrep on our code and gitleaks on the whole history;
#    the results go to the owner's Security console (Admin → Security) and are kept as an artifact.
#  - Every Sunday: also the load test (200 clients) and the browser test at 390 px and 1280 px.
# A scheduled run that fails opens (or updates) an issue labelled security-test; the developer's daily check
# (06:48 Zurich) reads it together with the error log, fixes what it can and reports in the issue.
on:
  pull_request:
    paths: ["android/**", "worker/**", "docs/testing/**", ".github/workflows/security-tests.yml"]
  schedule:
    - cron: "10 4 * * 1"   # every Monday 06:10 in Zurich in summer (Human: vulnerabilities once a week), before the morning routine
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the load test and the browser test"
        type: boolean
        default: false

concurrency:
  group: hint365-security-scans
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QA: ${{ github.workspace }}/qa-results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks reads the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Weekly extras on Sundays
        if: github.event_name == 'schedule'
        run: '[ "$(date -u +%u)" = "7" ] && echo "WEEKLY=1" >> "$GITHUB_ENV" || true'
      - name: Start a local copy of the Worker (dummy secrets, empty database)
        run: |
          cd worker && npm install --no-audit --no-fund --silent && cd ..
          bash docs/testing/harness/setup-local.sh "$QA"
      - name: Functional and security suite
        working-directory: docs/testing/harness
        run: HINT_WORKER_DIR="$QA/w" HINT_OUT="$QA/functional.json" node functional.mjs
      - name: Lab import and security regressions
        working-directory: docs/testing/harness
        run: HINT_WORKER_DIR="$QA/w" node --experimental-strip-types labs-security.mjs
      - name: Time zone and summer time
        if: always()
        working-directory: docs/testing/harness
        run: HINT_OUT="$QA/timezone.json" node timezone.mjs
      - name: Same probe as on the live site, on the local copy
        if: always()
        working-directory: docs/testing/harness
        run: HINT_OUT="$QA/probe-local.json" node prod-probe.mjs http://127.0.0.1:8787
      - name: Tools that build and deploy the server (known critical vulnerabilities)
        # the Worker itself has no runtime packages; wrangler is what deploys it
        if: always() && github.event_name != 'pull_request'
        working-directory: worker
        run: npm i --package-lock-only --silent --no-fund && npm audit --audit-level=critical
      - name: Full list of the app's libraries (Gradle resolves every library and what it pulls in)
        if: always() && github.event_name != 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: always() && github.event_name != 'pull_request'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve the Android dependency tree
        if: always() && github.event_name != 'pull_request'
        working-directory: android
        env:
          BATTITO_API_URL: https://example.invalid
          GOOGLE_WEB_CLIENT_ID: check.apps.googleusercontent.com
        run: |
          gradle -q :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > "$QA/gradle-deps.txt"
          gradle -q buildEnvironment --no-daemon > "$QA/gradle-build.txt"
          grep -c -- '--- ' "$QA/gradle-deps.txt" "$QA/gradle-build.txt"
      - name: Vulnerability scan of every library (OSV.dev)
        # Android (full tree), the web libraries in worker/public/my/vendor, the server's tools
        if: always() && github.event_name != 'pull_request'
        working-directory: docs/testing/harness
        run: HINT_GRADLE_DEPS="$QA/gradle-deps.txt" HINT_GRADLE_BUILD="$QA/gradle-build.txt" HINT_JSON="$QA/vulns.json" node vuln-scan.mjs "$QA/vulnerability-scan.md"
      - name: Our own code (Semgrep, open-source rules)
        if: always() && github.event_name != 'pull_request'
        run: |
          pipx run semgrep==1.* scan --metrics off --quiet --json --output "$QA/semgrep.json" \
            --config p/default --config p/kotlin --config p/typescript --config p/javascript \
            --severity ERROR --severity WARNING \
            --exclude 'worker/public/my/vendor' --exclude 'docs' worker/src worker/public android/app/src
          jq '.results | length' "$QA/semgrep.json"
      - name: Secrets written in the repository, whole history (gitleaks, values redacted)
        if: always() && github.event_name != 'pull_request'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --exit-code 0 --report-format json --report-path "$QA/gitleaks.json"
          jq 'length' "$QA/gitleaks.json"
      - name: Publish the results to the owner's Security console (D1)
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c6de5312c59db866e1a8e07d3c21c63
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node docs/testing/harness/publish-security.mjs "$QA"
      - name: Passive probe of the live site
        if: always() && github.event_name != 'pull_request'
        working-directory: docs/testing/harness
        run: HINT_OUT="$QA/probe-live.json" node prod-probe.mjs
      - name: Load test (200 clients)
        if: always() && (env.WEEKLY == '1' || inputs.full == true)
        working-directory: docs/testing/harness
        run: HINT_WORKER_DIR="$QA/w" CLIENTS=200 HINT_OUT="$QA/stress.json" node stress.mjs
      - name: Browser test (390 px and 1280 px)
        if: always() && (env.WEEKLY == '1' || inputs.full == true)
        working-directory: docs/testing/harness
        run: |
          npm install --no-save --no-audit --no-fund --silent playwright@1
          npx playwright install --with-deps chromium >/dev/null
          HINT_WORKER_DIR="$QA/w" HINT_SHOTS="$QA/shots" HINT_OUT="$QA/ui.json" node ui.mjs
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-tests-${{ github.run_number }}
          path: |
            ${{ env.QA }}/*.json
            ${{ env.QA }}/shots
            ${{ env.QA }}/wrangler.log
          retention-days: 30
      - name: Open or update the security-test issue when a scheduled run fails
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The scheduled security tests failed on \`${GITHUB_SHA::7}\` ($(date -u +%F))."
            echo
            echo "| Suite | Check | What | Detail |"
            echo "|---|---|---|---|"
            for f in "$QA"/*.json; do
              jq -r --arg s "$(basename "$f" .json)" '(.failed // .checks // [])[] | select(.ok == false) | "| \($s) | \(.id) | \(.desc) | \(.detail // "" | tostring | .[0:160] | gsub("\\|"; "/") | gsub("\n"; " ")) |"' "$f" 2>/dev/null || true
            done
            if [ -f "$QA/vulnerability-scan.md" ] && grep -q "known vulnerabilit" "$QA/vulnerability-scan.md" && ! grep -q "No known vulnerability" "$QA/vulnerability-scan.md"; then
              echo; sed -n '3,/^## Libraries checked/p' "$QA/vulnerability-scan.md" | sed '$d'
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (results kept 30 days as an artifact)."
            echo "Picked up by the developer's daily check (06:48 Zurich) with the error log. Test data only: no real readings."
          } > body.md
          gh label create security-test --color 4FB6A8 --description "Scheduled security tests failed" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --label security-test --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "Security tests $(date -u +%F)" --label security-test --body-file body.md; fi
