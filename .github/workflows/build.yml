name: Build PersonalHealthy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hint365-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality:
    name: Verify before publishing
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local functional and lab security tests
        run: |
          cd worker && npm ci --no-audit --no-fund && cd ..
          bash docs/testing/harness/setup-local.sh "$RUNNER_TEMP/hint-qa"
          HINT_WORKER_DIR="$RUNNER_TEMP/hint-qa/w" node docs/testing/harness/functional.mjs
          HINT_WORKER_DIR="$RUNNER_TEMP/hint-qa/w" node docs/testing/harness/labs-security.mjs
          node docs/testing/harness/timezone.mjs
      - name: Canonical legal pages are current
        run: |
          cd worker && node scripts/export-docs.mjs && cd ..
          git diff --exit-code -- docs/legal

  server:
    needs: [quality, apk]
    name: Deploy the server
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      db: ${{ steps.db.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: HealthyInstantTracker-apk
          path: apk
      - id: db
        name: PersonalHealthy database (D1, data bound to the European Union)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c6de5312c59db866e1a8e07d3c21c63
        run: |
          npm ci --no-audit --no-fund --silent
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API?name=personalhealthy" | jq -r '.result[]? | select(.name=="personalhealthy") | .uuid' | head -1)
          if [ -z "$ID" ]; then
            echo "Creating the personalhealthy database in Europe"
            ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API" \
                 --data '{"name":"personalhealthy","jurisdiction":"eu"}' | jq -r '.result.uuid // empty')
          fi
          if [ -z "$ID" ]; then echo "Database not created: check that the token has the D1 Edit permission"; exit 1; fi
          echo "Database: $ID"
          sed -i "s/D1_DATABASE_ID/$ID/" wrangler.toml
          echo "db=$ID" >> "$GITHUB_OUTPUT"
          npx wrangler d1 execute personalhealthy --remote --file=schema.sql
          # Columns added after the first version: add them to existing tables if missing
          add_col() {
            OUT=$(npx wrangler d1 execute personalhealthy --remote --command "ALTER TABLE $1 ADD COLUMN $2 $3" 2>&1) \
              && echo "Added column $1.$2" \
              || { echo "$OUT" | grep -qi "duplicate column" && echo "Column $1.$2 already there" || { echo "$OUT"; exit 1; }; }
          }
          # Readable Swiss-time columns (*_local)
          for col in persons.created_at_local scans.taken_at_local scans.created_at_local \
                     measurements.taken_at_local measurements.created_at_local ledger.created_at_local; do
            add_col "${col%%.*}" "${col#*.}" TEXT
          done
          # Who pays: 'owner' (the owner's key and credit) or 'self' (a friend with their own key)
          add_col persons pays "TEXT NOT NULL DEFAULT 'owner'"
          # Whose money each credit movement belongs to (empty = the owner)
          add_col ledger payer TEXT
          # Sign in with Google: the account's stable id, its email, and when the person accepted the privacy note
          add_col persons google_sub TEXT
          add_col persons email TEXT
          add_col persons consent_at INTEGER
          # The AI state of each person's own Anthropic key, as Anthropic last answered: ok / no_credit / invalid
          add_col person_keys status TEXT
          add_col person_keys checked_at INTEGER
          # The yearly subscription (Google Play): the purchase token, the end date, Google Play's state, the last check
          add_col persons sub_token TEXT
          add_col persons sub_until INTEGER
          add_col persons sub_state TEXT
          add_col persons sub_checked_at INTEGER
          # When the app was last opened (a usage figure for the owner's area)
          add_col persons last_seen_at INTEGER
          # The app version each account last opened with (shown to the owner)
          add_col persons app_version TEXT
          npx wrangler d1 execute personalhealthy --remote \
            --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_persons_google ON persons (google_sub)"
          # Everyone pays their own photo readings with their own Anthropic key. The shared credit ("owner") becomes the
          # app manager's own, and every account pays for itself. Safe to run again: afterwards it changes nothing.
          npx wrangler d1 execute personalhealthy --remote --command \
            "UPDATE ledger SET payer = (SELECT id FROM persons WHERE is_admin = 1 LIMIT 1) WHERE COALESCE(payer, 'owner') = 'owner' AND EXISTS (SELECT 1 FROM persons WHERE is_admin = 1); UPDATE persons SET pays = 'self' WHERE COALESCE(pays, 'owner') <> 'self'"

      - name: workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          U="https://api.cloudflare.com/client/v4/accounts/6c6de5312c59db866e1a8e07d3c21c63/workers/subdomain"
          R=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$U")
          echo "Check: $(echo "$R" | jq -c '{success, subdomain: .result.subdomain, errors}')"
          if [ -z "$(echo "$R" | jq -r '.result.subdomain // empty')" ]; then
            echo "Registering the comevava76 subdomain"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              "$U" --data '{"subdomain":"comevava76"}' | jq -c '{success, errors}'
          fi

      - id: deploy
        name: Deploy the server
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c6de5312c59db866e1a8e07d3c21c63
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
          # JSON key of the Google Cloud service account that checks subscriptions with Google Play (optional)
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          # GitHub token that may open issues in this repository: the Security console's Fix button (optional)
          SECURITY_FIX_TOKEN: ${{ secrets.SECURITY_FIX_TOKEN }}
          # Google Cloud "Web client ID" for Sign in with Google (not a secret: it only names the app to Google).
          # The repository variable GOOGLE_WEB_CLIENT_ID, if set, takes its place.
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '556501292660-jpsjfj7ob3em9dl5q2obq6j94l836grm.apps.googleusercontent.com' }}
          # contact email shown on the public privacy page (repository variable; optional)
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # the user guides (PDF, Italian and English) are served next to the app
          cp ../docs/HINT-*.pdf public/
          # Promote the tested server and the APK from this same revision together.
          cp ../apk/HealthyInstantTracker-*.apk public/HINT.apk
          npx wrangler deploy --var "GOOGLE_CLIENT_ID:$GOOGLE_WEB_CLIENT_ID" --var "CONTACT_EMAIL:$CONTACT_EMAIL" --var "APP_VERSION:${{ github.run_number }}" 2>&1 | tee deploy.log
          jq -n --arg a "$ANTHROPIC_API_KEY" --arg f "$FAMILY_CODE" '{ANTHROPIC_API_KEY:$a, FAMILY_CODE:$f}' > secrets.json
          npx wrangler secret bulk secrets.json
          rm -f secrets.json
          # sent only when the GitHub secret exists: an empty value would switch the subscription check off
          if [ -n "$PLAY_SERVICE_ACCOUNT" ]; then
            ( umask 077; jq -n --arg k "$PLAY_SERVICE_ACCOUNT" '{PLAY_SERVICE_ACCOUNT:$k}' > play.json )
            npx wrangler secret bulk play.json
            rm -f play.json
          fi
          if [ -n "$SECURITY_FIX_TOKEN" ]; then
            ( umask 077; jq -n --arg k "$SECURITY_FIX_TOKEN" '{GITHUB_FIX_TOKEN:$k}' > fix.json )
            npx wrangler secret bulk fix.json
            rm -f fix.json
          fi
          # KEY_ENCRYPTION_KEY encrypts friends' Anthropic keys. It is created once, here, and never
          # printed or replaced: a new one would make every stored friend key unreadable.
          # If the list of secrets cannot be read, stop rather than risk overwriting it.
          LIST=$(npx wrangler secret list --format json 2>/dev/null) || { echo "Could not read the server's secrets"; exit 1; }
          echo "$LIST" | jq -e 'type == "array"' > /dev/null || { echo "Could not read the server's secrets"; exit 1; }
          if echo "$LIST" | jq -e 'any(.[]; .name == "KEY_ENCRYPTION_KEY")' > /dev/null; then
            echo "KEY_ENCRYPTION_KEY already there: left as it is"
          else
            ( umask 077; jq -n --arg k "$(openssl rand -base64 32)" '{KEY_ENCRYPTION_KEY:$k}' > kek.json )
            npx wrangler secret bulk kek.json
            rm -f kek.json
            echo "KEY_ENCRYPTION_KEY created"
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then URL="${{ vars.BATTITO_API_URL }}"; fi
          if [ -z "$URL" ]; then echo "Server address not found"; exit 1; fi
          curl -sf "$URL/v1/health" && echo " <- server reachable"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  apk:
    name: Build the APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key from the secrets (if the owner has added them)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/hint.keystore"
            echo "HINT_KEYSTORE_FILE=$RUNNER_TEMP/hint.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::ANDROID_KEYSTORE_B64 is required. Provision a new private signing key."
            exit 1
          fi
      - name: Compile
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BATTITO_API_URL: ${{ vars.BATTITO_API_URL || 'https://personalhealthy-api.comevava76.workers.dev' }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '556501292660-jpsjfj7ob3em9dl5q2obq6j94l836grm.apps.googleusercontent.com' }}
        run: |
          gradle testDebugUnitTest assembleRelease bundleRelease --no-daemon --stacktrace
          python3 scripts/sign-rotated.py
      - name: Prepare the file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "HealthyInstantTracker-0.1.${{ github.run_number }}.apk"
          # the same version as an App Bundle, the file Google Play asks for
          cp android/app/build/outputs/bundle/release/app-release.aab "HINT365-0.1.${{ github.run_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthyInstantTracker-apk
          path: |
            HealthyInstantTracker-*.apk
            HINT365-*.aab
  release:
    name: Record the promoted release
    needs: [server, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HealthyInstantTracker-apk
          path: .
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" "HealthyInstantTracker-0.1.${{ github.run_number }}.apk" \
            "HINT365-0.1.${{ github.run_number }}.aab" \
            --title "HealthyInstantTracker 0.1.${{ github.run_number }}" \
            --notes "Download the .apk file on your phone and install it." --repo "${{ github.repository }}"
