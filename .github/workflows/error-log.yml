name: Error log report

# Step 1 of the continuous improvement loop (docs/architecture, page 4).
# Every morning it reads the last 24 hours of the error log (D1 table error_log: grouped, no reading values)
# and, if there is anything, opens an issue "Error log <date>" labelled error-log. The developer's scheduled
# check (06:48 Zurich) reads the open error-log issues, fixes what can be fixed, and closes them with a report.
on:
  schedule:
    - cron: "30 4 * * *"   # 06:30 in Zurich in summer, 05:30 in winter
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read the last 24 hours and open an issue if there are errors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c6de5312c59db866e1a8e07d3c21c63
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API?name=personalhealthy" | jq -r '.result[]? | select(.name=="personalhealthy") | .uuid' | head -1)
          [ -n "$ID" ] || { echo "Database not found"; exit 1; }
          SINCE=$(( ($(date +%s) - 86400) * 1000 ))
          BODY=$(jq -n --argjson s "$SINCE" '{sql: "SELECT day, source, code, place, app_version, count, message FROM error_log WHERE last_at > ?1 ORDER BY count DESC LIMIT 100", params: [$s]}')
          ROWS=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/$ID/query" --data "$BODY" | jq -c '.result[0].results // []')
          N=$(echo "$ROWS" | jq 'length')
          echo "Groups of errors in the last 24 hours: $N"
          [ "$N" -gt 0 ] || exit 0
          TOTAL=$(echo "$ROWS" | jq '[.[].count] | add')
          {
            echo "Errors of the last 24 hours: **$TOTAL** in **$N** groups (no reading values; digits removed)."
            echo
            echo "| Day | Source | Place | Code | Times | Version | Message |"
            echo "|---|---|---|---|---|---|---|"
            echo "$ROWS" | jq -r '.[] | "| \(.day) | \(.source) | `\(.place)` | `\(.code)` | \(.count) | \(.app_version) | \(.message // "" | gsub("\\|"; "/")) |"'
            echo
            echo "Picked up by the developer's daily check (06:48 Zurich): each group is analysed, small fixes are merged, the rest is proposed. The issue is closed with the report."
          } > body.md
          gh label create error-log --color 8C7BF2 --description "Daily error log report" --repo "${{ github.repository }}" 2>/dev/null || true
          gh issue create --repo "${{ github.repository }}" --title "Error log $(date -u +%F)" --label error-log --body-file body.md
